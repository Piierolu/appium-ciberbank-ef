webdriver {
  driver = appium
  autodownload = false
}

appium {
  process.desired.capabilities = true
  additional.capabilities = "app,appPackage,appActivity,automationName,deviceName,autoGrantPermissions,newCommandTimeout,uiautomator2ServerInstallTimeout,adbExecTimeout,noReset"

  hub = "http://127.0.0.1:4723"
  platformName = "Android"

  app = ${user.dir}"/app/ciberbank-debug.apk"
  appPackage = "edu.pe.cibertec.ciberbank"
  appActivity = ".ui.SplashActivity"

  automationName = "UiAutomator2"
  deviceName = "emulator-5554"
  autoGrantPermissions = true
  newCommandTimeout = 300
  uiautomator2ServerInstallTimeout = 120000
  adbExecTimeout = 60000

   noReset = false
}

serenity {
  project.name = "Automatizacion Mobile - CiberBank"
  take.screenshots = FOR_EACH_ACTION
  report.show.step.details = true
  report.encoding = "UTF-8"
  timeout = 20000

  # Una sesion de Appium por escenario, para que cada uno arranque con datos limpios.
  restart.browser.for.each = scenario
}
